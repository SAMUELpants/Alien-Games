<!-- LOGIN BUTTONS -->
<div style="position:fixed; top:20px; right:20px; z-index:10000;">
  <button id="loginBtn">Login</button>

<!-- FIREBASE AUTH -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getAuth, signInWithPopup, GoogleAuthProvider, signOut, onAuthStateChanged }
from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyAv9stc2v_g2VufOHUSlIAFehl2Gx4UE1E",
  authDomain: "alien-games-2969a.firebaseapp.com",
  projectId: "alien-games-2969a",
  storageBucket: "alien-games-2969a.firebasestorage.app",
  messagingSenderId: "252082915218",
  appId: "1:252082915218:web:f51254830d4063237c634b"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const provider = new GoogleAuthProvider();

const loginBtn = document.getElementById("loginBtn");
const logoutBtn = document.getElementById("logoutBtn");
const site = document.getElementById("siteContent");

loginBtn.onclick = () => signInWithPopup(auth, provider);
logoutBtn.onclick = () => signOut(auth);

onAuthStateChanged(auth, user => {
  if (user) {
    site.style.display = "block";
    loginBtn.style.display = "none";
    logoutBtn.style.display = "inline-block";
  } else {
    site.style.display = "none";
    loginBtn.style.display = "inline-block";
    logoutBtn.style.display = "none";
  }
});
</script>
